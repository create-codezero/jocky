[package]
name = "jocky_agent"
version = "0.2.0"
edition = "2021"

[lib]
name = "jocky_runtime"
crate-type = ["staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
sha2 = "0.10"
sysinfo = "0.30"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1.8"